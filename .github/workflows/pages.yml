name: Deploy GitHub Pages

on:
    push:
        branches: [main]
        paths:
            - "chatbot/public/**"
            - ".github/workflows/pages.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4

            - name: Prepare chatbot site
              run: |
                  mkdir _site
                  cp chatbot/public/* _site/
                  cp .nojekyll _site/

            - uses: actions/configure-pages@v5

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

            - id: deployment
              uses: actions/deploy-pages@v4
